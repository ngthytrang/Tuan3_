<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh sách bài làm</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            align-items: center;
            padding: clamp(16px, 5vw, 64px);
            color: #16372d;
            background: radial-gradient(ellipse at 85% 12%, #e3ebc9, transparent 55%), #f5f3e9;
            font-family: system-ui, sans-serif;
        }

        main {
            width: min(100%, 860px);
            margin-inline: auto;
            padding: clamp(24px, 7vw, 76px);
            border: 1px solid #d7ddca;
            border-radius: 28px;
            background: #fffdf6;
            box-shadow: 0 24px 64px #16372d14;
        }

        h1 {
            margin: 0 0 32px;
            font-family: Georgia, serif;
            font-size: clamp(2.25rem, 7vw, 4.75rem);
            line-height: 1.05;
        }

        ul { margin: 0; padding: 0; list-style: none; }
        li + li { margin-top: 12px; }

        a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px clamp(16px, 4vw, 28px);
            border-radius: 16px;
            background: #17483a;
            color: #fffdf6;
            font-size: 1.125rem;
            font-weight: 650;
            text-decoration: none;
        }

        a:hover { background: #215f4c; }
        a:focus-visible { outline: 3px solid #17483a; outline-offset: 4px; }

        a span {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #dcefaa;
            color: #16372d;
        }
    </style>
</head>
<body>
    <main>
        <h1>Danh sách bài làm</h1>
        <ul>
            <li><a href="./Bai1.html">Bài 1 <span aria-hidden="true">→</span></a></li>
        </ul>
    </main>
</body>
</html>
