<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vẹt qua rừng tre</title><link rel="stylesheet" href="game.css"><script defer src="../jquery.min.js"></script><script defer src="game.js"></script></head>
<body><main><header><a href="../demo.html">← Tổng hợp Nhóm 2</a><h1>Vẹt qua rừng tre</h1><p>Nhấn <kbd>↓</kbd> hoặc chạm <strong>Vỗ cánh</strong> để bay. Vượt 50 cặp ống tre để chiến thắng.</p></header>
<div class="stage"><canvas id="field" width="640" height="420" aria-label="Sân chơi vẹt bay qua ống tre"></canvas>
<div class="hud"><strong id="level">Level 1</strong><span id="score">0 / 50</span><span id="best">Kỷ lục 0</span></div>
<div id="overlay" class="overlay"><div><h2 id="message" aria-live="polite">Sẵn sàng cất cánh?</h2><button id="start" type="button">Bắt đầu</button></div></div></div>
<div class="actions"><button type="button" id="flap">↓ Vỗ cánh</button><button type="button" id="pause" disabled>Tạm dừng</button></div>
</main></body></html>
