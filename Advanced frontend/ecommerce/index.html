<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mộc Rang — Cà phê Việt</title>
<link rel="stylesheet" href="vendor/bootstrap.min.css"><link rel="stylesheet" href="vendor/xzoom.css"><link rel="stylesheet" href="vendor/star-rating.min.css"><link rel="stylesheet" href="shop.css">
<script defer src="../jquery.min.js"></script><script defer src="vendor/bootstrap.min.js"></script><script defer src="vendor/xzoom.min.js"></script><script defer src="vendor/star-rating.min.js"></script><script defer src="shop.js"></script></head>
<body><header class="masthead"><div class="wrap topbar"><a class="brand" href="index.html">Mộc Rang<span>Cà phê Việt</span></a><nav><a href="#catalog">Sản phẩm</a><button id="open-orders" type="button">Đơn hàng</button><button id="open-cart" type="button">Giỏ hàng <span id="cart-count">0</span></button></nav></div></header>
<main><section class="hero"><div class="hero-copy"><h1>Cà phê rang mộc</h1><p>Chọn hạt Arabica, Robusta hoặc phối trộn theo cách bạn pha mỗi sáng.</p><a class="action" href="#catalog">Xem cà phê</a></div><div id="hero-gallery" class="carousel slide" aria-label="Ảnh cà phê">
  <div class="carousel-inner">
    <div class="item active"><img src="images/brew.jpg" alt="Cà phê mới pha"></div>
    <div class="item"><img src="images/arabica.jpg" alt="Hạt cà phê rang"></div>
    <div class="item"><img src="images/blend.jpg" alt="Một cách thưởng thức cà phê"></div>
  </div>
  <button class="gallery-prev" type="button" data-target="#hero-gallery" data-slide="prev" aria-label="Ảnh trước">‹</button>
  <button class="gallery-next" type="button" data-target="#hero-gallery" data-slide="next" aria-label="Ảnh sau">›</button>
</div></section>
<section id="catalog" class="wrap catalog"><div class="catalog-head"><h2>Chọn cà phê</h2><div class="filters"><label>Tìm sản phẩm<input id="search" type="search" placeholder="Nhập tên cà phê"></label><label>Loại cà phê<select id="category"><option value="">Tất cả</option><option>Arabica</option><option>Robusta</option><option>Phối trộn</option></select></label></div></div>
<div id="products" class="product-grid"></div><p id="empty-products" hidden>Không có sản phẩm phù hợp.</p><p id="status" role="status"></p></section></main>
<footer><div class="wrap">Mộc Rang · Bài thực hành Advanced Frontend <a href="../demo.html">← Tổng hợp Nhóm 2</a></div></footer>
<dialog id="detail"><div class="dialog-head"><h2 id="detail-title">Chi tiết sản phẩm</h2><button type="button" data-close aria-label="Đóng chi tiết">×</button></div><div id="detail-body"></div></dialog>
<dialog id="cart"><div class="dialog-head"><h2>Giỏ hàng</h2><button type="button" data-close aria-label="Đóng giỏ hàng">×</button></div>
<div id="cart-lines"></div><p class="total">Tổng cộng <strong id="cart-total"></strong></p>
<form id="checkout"><h3>Đặt hàng mô phỏng</h3><label>Họ và tên<input name="name" required></label><label>Email<input name="email" type="email" required></label><button type="submit" id="place-order" class="action">Xác nhận đơn mẫu</button></form><p id="cart-status" role="status"></p></dialog>
<dialog id="orders"><div class="dialog-head"><h2>Đơn hàng</h2><button type="button" data-close aria-label="Đóng đơn hàng">×</button></div><div id="orders-list"></div></dialog></body></html>
